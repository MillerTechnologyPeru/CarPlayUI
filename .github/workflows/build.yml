name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-ios:
    name: Build for iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build CarPlayDemo for iOS Simulator
        run: |
          xcodebuild build \
            -project Xcode/CarPlayDemo.xcodeproj \
            -scheme CarPlayDemo \
            -destination 'generic/platform=iOS Simulator'
